<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ATP Ultra</title>
    <script>
      // GitHub Pages SPA redirect
      // Stores the path and redirects to index.html which React Router picks up
      var base = '/atp-ultra-ui/';
      var path = location.pathname;
      if (path.startsWith(base)) {
        path = path.slice(base.length - 1); // keep the leading /
      }
      sessionStorage.setItem('spa-redirect', path + location.search + location.hash);
      location.replace(base);
    </script>
  </head>
  <body></body>
</html>
